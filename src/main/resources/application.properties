spring.application.name=Api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employee_db}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

jwt.secret=${JWT_SECRET}
jwt.expiration=600000

# Refresh Token: 7 days
jwt.refresh-token-expiration=604800000

# Local HTTP development
jwt.refresh-cookie-secure=false

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# File Storage Configuration
app.file.storage-location=${FILE_STORAGE_LOCATION:./storage}
app.file.max-size=5MB

# Allowed File Types
app.file.allowed-types=application/pdf,image/jpeg,image/png

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ClamAV Antivirus Configuration
app.clamav.host=${CLAMAV_HOST:localhost}
app.clamav.port=${CLAMAV_PORT:3310}
app.clamav.connection-timeout=3000
app.clamav.read-timeout=30000